<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio / Registro</title>
    <link rel="stylesheet" href="C:\Users\4.C Programación\Documents\GitHub\Skillnest_fullStack_Python\python\mysql\erd\administrador_de_usuarios\static\css\style.css">
</head>
<body>
    <main class="app-container">
        <div class="split-layout">
            <div class="auth-box">
                <h2>Inicio de Sesión</h2>
                <form action="dashboard_admin.html" method="GET">
                    <div class="form-group">
                        <label>E-mail</label>
                        <input type="email" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" required>
                    </div>
                    <button type="submit" class="btn">Iniciar Sesión</button>
                </form>
            </div>
            
            <div class="auth-box">
                <h2>Registro</h2>
                <form action="dashboard_usuario.html" method="GET">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" required>
                    </div>
                    <div class="form-group">
                        <label>E-mail</label>
                        <input type="email" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" required>
                    </div>
                    <div class="form-group">
                        <label>Conf. Contraseña</label>
                        <input type="password" required>
                    </div>
                    <div class="action-row">
                        <button type="submit" class="btn">Registrar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
