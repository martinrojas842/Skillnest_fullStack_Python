<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Juego del Destino</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="icon-circle"><i class="fas fa-moon"></i></div>
            <h1>El Juego del Destino</h1>
            <p>Descubre qué te depara el futuro</p>
        </div>
        <div class="card-body">
            <form action="/enviar" method="POST">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="nombre" placeholder="Tu nombre" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-calendar-alt"></i>
                    <input type="number" name="edad" placeholder="Tu edad" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-palette"></i>
                    <input type="text" name="color" placeholder="Tu color favorito" required>
                </div>
                <small class="help-text">Ej. rojo, azul, verde, morado, amarillo...</small>

                <div class="input-group">
                    <i class="fas fa-paw"></i>
                    <input type="text" name="animal" placeholder="Tu animal favorito" required>
                </div>
                <small class="help-text">Ej. perro, gato, águila, león, delfín...</small>

                <div class="crystal-ball">🔮</div>

                <button type="submit" class="btn"><i class="fas fa-magic"></i> Revelar mi destino</button>
            </form>
        </div>
    </div>
</body>
</html>
